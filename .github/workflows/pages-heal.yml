name: Läk misslyckad sajtpublicering
run-name: Läk sajtpublicering (${{ github.event.workflow_run.conclusion || 'provkörning' }})

# VARFÖR DEN FINNS
# Allt robotarna hämtar committas hit och publiceras sedan av GitHubs eget
# flöde »pages build and deployment«. Det flödets deploy-jobb dör ibland på
# timeout i »syncing_files« (3 av 600 körningar 19/10–12/11 2026). Filen ligger
# då i repot, men den GAMLA versionen serveras tills nästa push går igenom:
# 10/11 saknades sex nya amerikanska flygförbud (TFR) på kartan i 133 minuter.
#
# VAD DEN GÖR
# När en publicering faller begär den en ny av det som ligger i repot just då
# (POST pages/builds bygger alltid HEAD — till skillnad från att köra om den
# gamla körningen, som kan rulla tillbaka sajten om en nyare hunnit ut).
# Högst tre försök: direkt, efter 10 min och efter ytterligare 30 min. Har en
# vanlig push hunnit publicera under tiden gör den ingenting.
#
# VEM SOM VAKTAR DEN
# Raden »Sajtens publicering« på https://pappilappi.com/status
# (check_sajtpublicering i tools/data_health.py, KodKust/dronarkartan). Den
# läser den här filens läge under namnet pages-heal.yml — byt inte filnamn
# utan att ändra SAJT_LAK_WORKFLOW där.
#
# SÄKERHET
# workflow_run-flöden kör med skrivbar token. Den här checkar inte ut någon
# kod, laddar inte ner några artefakter och använder inga fält ur händelsen i
# skriptet — bara repots namn och en boolesk indata, båda via env.

on:
  workflow_run:
    # Flödets kanoniska namn (mätt 2026-11-13 via actions/workflows) + namnet
    # körningarna visas under, ifall GitHub byter vilket som matchas.
    workflows: ["pages-build-deployment", "pages build and deployment"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tvinga:
        description: "Provkörning: begär en ny publicering fast den senaste lyckades"
        type: boolean
        default: false

permissions:
  contents: read   # läsa HEAD
  actions: read    # läsa publiceringskörningarna
  pages: write     # begära en ny publicering

concurrency:
  group: pages-heal
  cancel-in-progress: false

jobs:
  lak:
    name: Begär ny publicering
    # En avbruten körning (cancelled) är normal: en nyare push ersatte den.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out' ||
      github.event.workflow_run.conclusion == 'startup_failure'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TVINGA: ${{ inputs.tvinga || 'false' }}
    steps:
      - name: Läk
        run: |
          set -euo pipefail

          # Väntan FÖRE försök 1, 2 och 3 (sekunder). Antalet poster = antal försök.
          PAUSER=(0 600 1800)
          # Fler fall i rad än så här (sedan senaste lyckade) när körningen
          # STARTAR = ihållande fel som redan fått sina försök: begär inte fler.
          STREAK_TAK=4
          # Så länge väntas en pågående publicering in. MÄTT: lyckade körningar
          # tar normalt 75 s, deploy-timeouten är 10 min, och en enda lyckad
          # körning har tagit 1 475 s (4/11 2026).
          VANTA_MAX=1800

          sag() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

          # gh api med tre försök — ett nätfel hos GitHub ska inte fälla läkningen.
          api() {
            local n=0 ut
            until ut=$(gh api "$@"); do
              n=$((n + 1))
              if [ "$n" -ge 3 ]; then
                echo "::error::gh api $1 misslyckades tre gånger" >&2
                return 1
              fi
              sleep 10
            done
            printf '%s\n' "$ut"
          }

          # Läser läget till HEAD_SHA, LIVE_SHA, PAGAR, STREAK och SENASTE.
          # Returnerar 2 om GitHub inte gick att läsa. OBS: `set -e` gäller INTE
          # inne i en funktion som anropas från if/||, så felen kontrolleras
          # uttryckligen — annars hade skriptet räknat vidare på tomma värden.
          lage() {
            local runs
            HEAD_SHA=$(api "repos/$REPO/commits?per_page=1" --jq '.[0].sha') || return 2
            runs=$(api "repos/$REPO/actions/runs?event=dynamic&per_page=30" --jq \
              '[.workflow_runs[] | select(.path | endswith("pages-build-deployment"))
                | {sha: .head_sha, status, conclusion}]') || return 2
            case "$HEAD_SHA" in ""|null) return 2 ;; esac
            # Senast LYCKADE publiceringens commit = det sajten visar.
            LIVE_SHA=$(jq -r '[.[] | select(.conclusion == "success")][0].sha // ""' <<<"$runs")
            PAGAR=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
            # Fall sedan senaste lyckade (körningarna kommer nyast först).
            STREAK=$(jq '[.[].conclusion] | (index("success") // length) as $n | .[:$n]
              | map(select(. == "failure" or . == "timed_out" or . == "startup_failure"))
              | length' <<<"$runs")
            SENASTE=$(jq -r '.[0].conclusion // .[0].status // "okänt"' <<<"$runs")
          }

          # Väntar tills ingen publicering pågår. Returnerar 1 om tiden gick ut
          # och 2 om läget inte gick att läsa.
          vanta_klart() {
            local slut=$(( $(date +%s) + VANTA_MAX ))
            while :; do
              lage || return 2
              [ "$PAGAR" -eq 0 ] && return 0
              [ "$(date +%s)" -ge "$slut" ] && return 1
              sleep 30
            done
          }

          # Begär en publicering och väntar tills körningen syns i listan —
          # annars läser nästa avläsning ett oförändrat läge och begär en till.
          begar() {
            local fore n=0
            fore=$(date -u -d '-30 seconds' +%Y-%m-%dT%H:%M:%SZ)
            api -X POST "repos/$REPO/pages/builds" --jq '.status' > /dev/null
            until [ "$(api -X GET "repos/$REPO/actions/runs" -f event=dynamic \
                      -f per_page=5 -f "created=>=$fore" --jq '.total_count')" -gt 0 ]; do
              n=$((n + 1))
              [ "$n" -ge 12 ] && break
              sleep 15
            done
          }

          # Ett läge som inte går att läsa är ett rött stopp, inte en gissning.
          olasbart() {
            echo "::error::Kunde inte läsa publiceringsläget från GitHub — ingen åtgärd vidtagen efter felet."
            sag "❌ Kunde inte läsa läget från GitHub (tre försök). Avbryter utan att begära något mer."
            exit 1
          }

          if [ "$TVINGA" = "true" ]; then
            lage || olasbart
            sag "🧪 Provkörning: begär en ny publicering av ${HEAD_SHA:0:7} fast läget är »${SENASTE}«."
            begar
            RC=0; vanta_klart || RC=$?
            [ "$RC" -eq 2 ] && olasbart
            if [ "$SENASTE" = "success" ] && [ "$LIVE_SHA" = "$HEAD_SHA" ]; then
              sag "✅ Provkörningen gick igenom: den begärda publiceringen av ${HEAD_SHA:0:7} lyckades."
              exit 0
            fi
            echo "::error::Provkörningen: den begärda publiceringen slutade i »${SENASTE}« (sajten visar ${LIVE_SHA:0:7}, repot ${HEAD_SHA:0:7})."
            sag "❌ Provkörningen föll: senaste publiceringen slutade i »${SENASTE}«."
            exit 1
          fi

          FORSOK=0
          PAUSAD=0
          while :; do
            RC=0; vanta_klart || RC=$?
            [ "$RC" -eq 2 ] && olasbart
            if [ "$RC" -eq 1 ]; then
              sag "⏳ En publicering har pågått i över $((VANTA_MAX / 60)) min — bedömer läget ändå."
            fi
            if [ -n "$LIVE_SHA" ] && [ "$LIVE_SHA" = "$HEAD_SHA" ]; then
              if [ "$FORSOK" -gt 0 ]; then
                sag "✅ Läkt: sajten visar det senaste i repot (${HEAD_SHA:0:7}) efter $FORSOK begärd(a) publicering(ar)."
              else
                sag "✅ Inget att göra: en nyare publicering hann före, sajten visar ${HEAD_SHA:0:7}."
              fi
              exit 0
            fi
            if [ "$FORSOK" -eq 0 ] && [ "$STREAK" -ge "$STREAK_TAK" ]; then
              echo "::warning::$STREAK publiceringar i rad har fallit — ihållande fel som redan fått sina försök. Begär inte fler; se https://pappilappi.com/status och https://www.githubstatus.com."
              sag "🛑 $STREAK publiceringar i rad har fallit. Den här körningen begär inga fler — nästa vanliga push försöker ändå."
              exit 0
            fi
            if [ "$FORSOK" -ge "${#PAUSER[@]}" ]; then
              echo "::error::Sajten visar ${LIVE_SHA:0:7} men repot är på ${HEAD_SHA:0:7}: $FORSOK begärda publiceringar har inte gått igenom."
              sag "❌ Gav upp efter $FORSOK försök. Sajten visar ${LIVE_SHA:0:7}, repot är på ${HEAD_SHA:0:7}. Begär en ny för hand när GitHub är friskt: gh api -X POST repos/$REPO/pages/builds"
              exit 1
            fi
            if [ "$FORSOK" -gt 0 ] && [ "$PAUSAD" -lt "$FORSOK" ]; then
              PAUS=${PAUSER[$FORSOK]}
              sag "⏸ Försök $FORSOK gick inte igenom (läge: ${SENASTE}). Väntar $((PAUS / 60)) min och läser läget på nytt."
              sleep "$PAUS"
              PAUSAD=$FORSOK
              continue
            fi
            sag "🔧 Försök $((FORSOK + 1)) av ${#PAUSER[@]}: begär en ny publicering av ${HEAD_SHA:0:7} (sajten visar ${LIVE_SHA:0:7}, fall i rad: $STREAK)."
            begar
            FORSOK=$((FORSOK + 1))
          done
